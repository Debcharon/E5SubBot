name: Release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([1-9][0-9]*)\.([0-9]{4})([0-9]{2})([0-9]{2})\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match vMAJOR.YYYYMMDD.REVISION (for example v1.20260926.0)." >&2
            exit 1
          fi
          release_date="${BASH_REMATCH[2]}-${BASH_REMATCH[3]}-${BASH_REMATCH[4]}"
          expected_date="${BASH_REMATCH[2]}${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
          if [[ $(date -u -d "$release_date" +%Y%m%d 2>/dev/null) != "$expected_date" ]]; then
            echo "Release tag contains an invalid calendar date." >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Release binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
